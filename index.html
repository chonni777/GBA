<style>
  body {

  #controls-bar {
    display:flex;

  #toggle-pad,

    border-radius:6px;

  #toggle-pad:hover,
  #toggle-speed:hover,
  #pad-bigger:hover,

  #toggle-speed.active {
    background:#c60;
  }

  #toggle-speed.active:hover {
    background:#e80;

  #pad-bigger,
  #pad-smaller {
    padding:8px 14px;
    font-weight:bold;
  }

  /* CONTROLES EN PANTALLA */

  #pad {
    display:none;
    position:absolute;
    inset:0;
    user-select:none;
    pointer-events:none;
    z-index:10;
    --pad-scale:1;
  }

  #pad.fullscreen-pad {
    position:fixed;
    z-index:2147483647;
  }

  #pad button {
    pointer-events:auto;
    border-radius:50%;
    border:2px solid #000;
    background:rgba(255,255,255,0.28);
    backdrop-filter:blur(1px);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:width 0.1s, height 0.1s;
  }

  #pad button:active,
  #pad button.pressed {
    background:rgba(255,255,255,0.55);
  }

  #pad .dpad {
    position:absolute;
    left:16px;
    bottom:16px;
    width:calc(150px * var(--pad-scale));
    height:calc(150px * var(--pad-scale));
  }

  #pad .dpad button {
    position:absolute;
    width:calc(50px * var(--pad-scale));
    height:calc(50px * var(--pad-scale));
    font-size:calc(14px * var(--pad-scale));
  }

  #pad .dpad button[data-key="ArrowUp"] {
    top:0;
    left:calc(50px * var(--pad-scale));
  }

  #pad .dpad button[data-key="ArrowDown"] {
    bottom:0;
    left:calc(50px * var(--pad-scale));
  }

  #pad .dpad button[data-key="ArrowLeft"] {
    top:calc(50px * var(--pad-scale));
    left:0;
  }

  #pad .dpad button[data-key="ArrowRight"] {
    top:calc(50px * var(--pad-scale));
    right:0;
  }

  #pad .action {
    position:absolute;
    right:16px;
    bottom:16px;
    width:calc(120px * var(--pad-scale));
    height:calc(120px * var(--pad-scale));
  }

  #pad .action button {
    position:absolute;
    width:calc(56px * var(--pad-scale));
    height:calc(56px * var(--pad-scale));
    font-size:calc(14px * var(--pad-scale));
  }

  #pad .action button[data-key="z"] {
    bottom:0;
    right:0;
  }

  #pad .action button[data-key="x"] {
    bottom:calc(30px * var(--pad-scale));
    right:calc(60px * var(--pad-scale));
  }

  #pad .shoulders {

  #pad .shoulders button {

  #pad .center {
    position:absolute;

    transform:translateX(-50%);
    display:flex;

  }

  #pad .center button {
    position:static;
    width:calc(70px * var(--pad-scale));
    height:calc(30px * var(--pad-scale));

  }

  #help {
    max-width:500px;

  #help h3 {

  table {

</style>
</head>

<body>

<h2 id="game-title">🎮 Cargando juego...</h2>

<div id="status">Preparando emulador...</div>

<div id="game-wrap">

  <div id="game"></div>

  <!-- CONTROLES TÁCTILES -->
  <div id="pad">

    <div class="shoulders">
      <button data-key="q">L</button>
      <button data-key="e">R</button>
    </div>

    <div class="dpad">
      <button data-key="ArrowUp">▲</button>
      <button data-key="ArrowDown">▼</button>
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowRight">▶</button>
    </div>

    <div class="action">
      <button data-key="z">A</button>
      <button data-key="x">B</button>
    </div>

    <div class="center">
      <button data-key="v">Select</button>
      <button data-key="Enter">Start</button>
    </div>

  </div>

</div>

<div id="controls-bar">
  <button id="toggle-pad">
    Mostrar controles en pantalla
  </button>

  <button id="toggle-speed">
    x2 (avance rápido)
  </button>

  <button id="pad-smaller">
    − Botones más chicos
  </button>

  <button id="pad-bigger">
    Botones más grandes +
  </button>
</div>

<div id="help">

<h3>Controles</h3>

<table>
<tr>
  <th>GBA</th>
  <th>Tecla</th>
</tr>

<tr>
  <td>D-pad</td>
  <td>Flechas ↑ ↓ ← →</td>
</tr>

<tr>
  <td>A</td>

<tr>
  <td>B</td>
  <td><code>X</code></td>
</tr>

<tr>
  <td>Start</td>
  <td><code>Enter</code></td>
</tr>

<tr>
  <td>Select</td>

</tr>

<tr>
  <td>L</td>

</tr>

<tr>
  <td>Avance rápido</td>

</tr>

<tr>
  <td>Rebobinar</td>
  <td><code>Espacio</code></td>
</tr>

</table>

</div>


<script>

/* =========================================================
   CARGAR AUTOMÁTICAMENTE EL JUEGO DESDE /roms/
   ========================================================= */

const params = new URLSearchParams(window.location.search);

const game = params.get("game");

if (!game) {

  document.getElementById("game-title").textContent =
    "❌ No se ha especificado ningún juego";

  document.getElementById("status").textContent =
    "Usa una URL como: emulador.html?game=mario.gba";

} else {

  /*
    IMPORTANTE:

    Los juegos deben estar en:

    /roms/

    Ejemplo:

    /roms/mario.gba
    /roms/pokemon.gba
  */

  const romURL = "../roms/" + encodeURIComponent(game);

  document.getElementById("game-title").textContent =
    "🎮 " + game;

  document.getElementById("status").textContent =
    "Cargando " + game + "...";


  /* CONFIGURACIÓN DE EMULATORJS */

  window.EJS_player = "#game";

  window.EJS_core = "gba";

  window.EJS_gameUrl = romURL;

  window.EJS_gameName = game;

  window.EJS_gameID =
    "gba_" + game.replace(/[^a-z0-9]/gi, "_").toLowerCase();

  window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

  window.EJS_startOnLoaded = true;


  /* CARGAR EMULATORJS */

  const script = document.createElement("script");

  script.src =
    window.EJS_pathtodata + "loader.js";

  script.onload = function() {

    document.getElementById("status").textContent =
      "🎮 " + game + " cargado";

  };

  script.onerror = function() {

    document.getElementById("status").textContent =
      "❌ Error cargando EmulatorJS";

  };

  document.body.appendChild(script);

}


/* =========================================================
   CONTROLES TÁCTILES
   ========================================================= */

const toggleBtn =
  document.getElementById("toggle-pad");

const pad =
  document.getElementById("pad");

toggleBtn.addEventListener("click", () => {

  const visible =
    pad.style.display === "block";

  pad.style.display =
    visible ? "none" : "block";

  toggleBtn.textContent =
    visible
      ? "Mostrar controles en pantalla"
      : "Ocultar controles en pantalla";

});


/* =========================================================
   TECLAS
   ========================================================= */

const KEY_CODES = {

  ArrowUp:38,
  ArrowDown:40,
  ArrowLeft:37,
  ArrowRight:39,

  Enter:13,

  z:90,
  x:88,
  v:86,

  q:81,
  e:69

};


function dispatchKey(type, key) {

  const keyCode =
    KEY_CODES[key] || 0;

  const event =
    new KeyboardEvent(type, {

      key:key,

      code:key,

      keyCode:keyCode,

      which:keyCode,

      bubbles:true,

      cancelable:true

    });


  Object.defineProperty(
    event,
    "keyCode",
    { get:() => keyCode }
  );

  Object.defineProperty(
    event,
    "which",
    { get:() => keyCode }
  );


  const target =
    document.querySelector("#game canvas") ||
    document.getElementById("game") ||
    document;


  target.dispatchEvent(event);

  document.dispatchEvent(event);

  window.dispatchEvent(event);

}


/* =========================================================
   BOTONES DEL PAD
   ========================================================= */

document
  .querySelectorAll("#pad button[data-key]")
  .forEach(btn => {

    const key =
      btn.dataset.key;


    const press = ev => {

      ev.preventDefault();

      btn.classList.add("pressed");

      dispatchKey(
        "keydown",
        key
      );

    };


    const release = ev => {

      ev.preventDefault();

      btn.classList.remove("pressed");

      dispatchKey(
        "keyup",
        key
      );

    };


    btn.addEventListener(
      "mousedown",
      press
    );

    btn.addEventListener(
      "mouseup",
      release
    );

    btn.addEventListener(
      "mouseleave",
      release
    );

    btn.addEventListener(
      "touchstart",
      press,
      { passive:false }
    );

    btn.addEventListener(
      "touchend",
      release
    );

});


/* =========================================================
   X2
   ========================================================= */

const speedBtn =
  document.getElementById("toggle-speed");

let fastForwardOn = false;


speedBtn.addEventListener("click", () => {

  fastForwardOn =
    !fastForwardOn;


  const event =
    new KeyboardEvent(

      fastForwardOn
        ? "keydown"
        : "keyup",

      {

        key:"+",

        code:"NumpadAdd",

        keyCode:107,

        which:107,

        bubbles:true,

        cancelable:true

      }

    );


  Object.defineProperty(
    event,
    "keyCode",
    { get:() => 107 }
  );

  Object.defineProperty(
    event,
    "which",
    { get:() => 107 }
  );


  const target =
    document.querySelector("#game canvas") ||
    document.getElementById("game") ||
    document;


  target.dispatchEvent(event);

  document.dispatchEvent(event);

  window.dispatchEvent(event);


  speedBtn.classList.toggle(
    "active",
    fastForwardOn
  );


  speedBtn.textContent =
    fastForwardOn
      ? "x1 (velocidad normal)"
      : "x2 (avance rápido)";

});


/* =========================================================
   TAMAÑO DE BOTONES
   ========================================================= */

const PAD_SCALE_MIN = 0.6;

const PAD_SCALE_MAX = 1.8;

const PAD_SCALE_STEP = 0.15;

let padScale = 1;


function applyPadScale() {

  pad.style.setProperty(
    "--pad-scale",
    padScale.toFixed(2)
  );

}


document
  .getElementById("pad-bigger")
  .addEventListener("click", () => {

    padScale =
      Math.min(
        PAD_SCALE_MAX,
        padScale + PAD_SCALE_STEP
      );

    applyPadScale();

});


document
  .getElementById("pad-smaller")
  .addEventListener("click", () => {

    padScale =
      Math.max(
        PAD_SCALE_MIN,
        padScale - PAD_SCALE_STEP
      );

    applyPadScale();

});


/* =========================================================
   FULLSCREEN
   ========================================================= */

const padOriginalParent =
  pad.parentElement;


document.addEventListener(
  "fullscreenchange",
  () => {

    const fsEl =
      document.fullscreenElement;


    if (
      fsEl &&
      fsEl !== padOriginalParent
    ) {

      fsEl.appendChild(pad);

      pad.classList.add(
        "fullscreen-pad"
      );

    } else {

      padOriginalParent.appendChild(pad);

      pad.classList.remove(
        "fullscreen-pad"
      );

    }

  }
);

</script>

</body>
</html>
